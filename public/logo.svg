<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F43F5E"/>
            <stop offset="50%" stop-color="#E11D48"/>
            <stop offset="100%" stop-color="#BE123C"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
        <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.35"/>
        </filter>
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.2"/>
        </filter>
    </defs>

    <!-- Outer Rounded Base Background -->
    <rect width="512" height="512" rx="128" fill="url(#bodyGrad)"/>
    
    <!-- Subtle Grid / Technology Lines in Background -->
    <circle cx="256" cy="256" r="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
    <circle cx="256" cy="256" r="220" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.25"/>

    <!-- Emerging Paper (Top Sheet) -->
    <path d="M168 130 C168 116 180 104 194 104 L318 104 C332 104 344 116 344 130 L344 210 L168 210 Z" fill="url(#paperGrad)" filter="url(#softShadow)"/>
    <!-- Paper Content Simulation Lines -->
    <rect x="196" y="132" width="120" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="196" y="152" width="80" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="196" y="172" width="100" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Printer Main Chassis / Body -->
    <rect x="108" y="200" width="296" height="170" rx="36" fill="url(#primaryGrad)" filter="url(#glow)"/>

    <!-- Printer Front Panel Inner Glass Accent -->
    <rect x="124" y="216" width="264" height="138" rx="26" fill="#0F172A" opacity="0.18"/>

    <!-- Printer Output Slot -->
    <rect x="144" y="260" width="224" height="24" rx="12" fill="#0F172A"/>

    <!-- Printed Paper Coming Out (Bottom Output Sheet with QR Code preview) -->
    <g filter="url(#softShadow)">
        <rect x="160" y="272" width="192" height="136" rx="18" fill="url(#paperGrad)"/>
        
        <!-- Stylized QR Code Pattern on Printed Paper -->
        <!-- Corner Finder 1 (Top-Left) -->
        <rect x="180" y="292" width="34" height="34" rx="8" fill="#BE123C"/>
        <rect x="187" y="299" width="20" height="20" rx="4" fill="#FFFFFF"/>
        <rect x="192" y="304" width="10" height="10" rx="2" fill="#BE123C"/>

        <!-- Corner Finder 2 (Top-Right) -->
        <rect x="298" y="292" width="34" height="34" rx="8" fill="#BE123C"/>
        <rect x="305" y="299" width="20" height="20" rx="4" fill="#FFFFFF"/>
        <rect x="310" y="304" width="10" height="10" rx="2" fill="#BE123C"/>

        <!-- Corner Finder 3 (Bottom-Left) -->
        <rect x="180" y="348" width="34" height="34" rx="8" fill="#BE123C"/>
        <rect x="187" y="355" width="20" height="20" rx="4" fill="#FFFFFF"/>
        <rect x="192" y="360" width="10" height="10" rx="2" fill="#BE123C"/>

        <!-- QR Data Dots & Connectivity Lines -->
        <circle cx="238" cy="309" r="5" fill="#0F172A"/>
        <circle cx="256" cy="309" r="5" fill="#0F172A"/>
        <circle cx="274" cy="309" r="5" fill="#0F172A"/>

        <rect x="233" y="330" width="46" height="8" rx="4" fill="#F43F5E"/>
        <rect x="233" y="348" width="28" height="8" rx="4" fill="#0F172A"/>
        <circle cx="280" cy="352" r="5" fill="#0F172A"/>

        <circle cx="238" cy="374" r="5" fill="#0F172A"/>
        <rect x="256" y="370" width="44" height="8" rx="4" fill="#BE123C"/>
        <circle cx="318" cy="374" r="5" fill="#0F172A"/>
    </g>

    <!-- Glowing Power & Status Indicators on Printer Front -->
    <circle cx="148" cy="236" r="6" fill="#10B981"/>
    <circle cx="148" cy="236" r="10" fill="#10B981" opacity="0.3"/>
    
    <circle cx="168" cy="236" r="5" fill="#38BDF8"/>

    <!-- Wireless / QR Cloud Waves Radiating From Printer -->
    <path d="M336 230 C344 230 352 234 358 240" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M336 222 C350 222 362 228 370 238" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
